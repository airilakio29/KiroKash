<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="KampusKash - Your personal student financial management assistant." />
    <title>KampusKash | Student Financial Tracker</title>

    <!-- PWA & Mobile Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KampusKash" />
    <meta name="application-name" content="KampusKash" />
    <meta name="theme-color" content="#CFD8FF" />
    <meta name="msapplication-TileColor" content="#CFD8FF" />
    <script>
      (function() {
        try {
          var b = localStorage.getItem('kampuskash_theme_boot');
          if (b) {
            var data = JSON.parse(b);
            if (data && data.tokens) {
              var r = document.documentElement;
              for (var k in data.tokens) {
                r.style.setProperty(k, data.tokens[k]);
              }
              r.style.colorScheme = data.isDark ? 'dark' : 'light';
              r.setAttribute('data-theme', data.isDark ? 'dark' : 'light');
              r.setAttribute('data-theme-preset', data.presetId || 'light');
              if (data.presetId === 'kiro') r.setAttribute('data-kiro', 'true');
              var tc = data.tokens['--theme-color'];
              if (tc) {
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute('content', tc);
                var mt = document.querySelector('meta[name="msapplication-TileColor"]');
                if (mt) mt.setAttribute('content', tc);
              }
            }
          }
        } catch(e) {}
      })();
    </script>
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
