<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0F" />
  <title>KampusKash | Offline</title>
  <style>
    :root {
      --bg: #0A0A0F;
      --card: rgba(26, 22, 37, 0.85);
      --border: rgba(139, 92, 246, 0.25);
      --primary: #8B5CF6;
      --primary-light: #C4B5FD;
      --text-main: #F3EDF9;
      --text-muted: #A79BB7;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      padding-top: calc(1.5rem + env(safe-area-inset-top, 0px));
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    }
    .offline-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 80px rgba(139, 92, 246, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .logo-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 18px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
    }
    .logo-container img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #FFFFFF 30%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }
    .notice-box {
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 0.82rem;
      color: var(--primary-light);
      line-height: 1.45;
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.5rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .retry-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.55);
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="logo-container">
      <img src="/icons/icon-192x192.png" alt="KampusKash" />
    </div>
    <h1>You're Offline</h1>
    <p>
      KampusKash is unable to establish an active network connection.
    </p>
    <div class="notice-box">
      🔒 <strong>Real-time Security Notice:</strong> Live financial synchronisation, balance calculations, and KampusKash AI Assistant require an active internet connection to ensure your records remain verified and up-to-date.
    </div>
    <button class="retry-btn" onclick="retryConnection()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Retry Connection
    </button>
  </div>

  <script>
    function retryConnection() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.retry-btn');
        btn.innerText = 'Still Offline...';
        setTimeout(() => {
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg> Retry Connection';
        }, 1500);
      }
    }
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
