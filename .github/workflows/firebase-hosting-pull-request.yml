# Builds each pull request and deploys it to a temporary Firebase Hosting preview channel.
# Uses the same secrets as firebase-hosting-merge.yml (FIREBASE_SERVICE_ACCOUNT_KAMPUSKASH_82B7C, VITE_ENV).
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    # Secrets are not available to pull requests from forks
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Write .env for the Vite build
        env:
          VITE_ENV: ${{ secrets.VITE_ENV }}
        run: |
          if ! printf '%s\n' "$VITE_ENV" | grep -q '^VITE_FIREBASE_API_KEY='; then
            echo "::error::Secret VITE_ENV is missing or has no VITE_FIREBASE_API_KEY line. Refusing to deploy a build without Firebase config."
            exit 1
          fi
          printf '%s\n' "$VITE_ENV" | tr -d '\r' | grep '^VITE_' > .env

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAMPUSKASH_82B7C }}
          projectId: kampuskash-82b7c
